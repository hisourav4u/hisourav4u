<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="How I work — principles">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#06080d"/></linearGradient>
<linearGradient id="sweep2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb454" stop-opacity="0"/><stop offset="0.5" stop-color="#ffb454" stop-opacity="0.06"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1280" height="500" rx="16" fill="url(#bg2)"/>
<rect width="1280" height="500" rx="16" fill="none" stroke="#1a2233" stroke-width="1.5"/>
<text x="48" y="56" font-size="13" letter-spacing="3" fill="#8792a8"><tspan fill="#ffb454">//</tspan> HOW I WORK</text>
<text x="1232" y="56" font-size="12" letter-spacing="2" fill="#8792a8" text-anchor="end">principles.d &#183; 6 loaded</text>
<rect x="-200" y="76" width="200" height="376" fill="url(#sweep2)"><animateTransform attributeName="transform" type="translate" from="-200 0" to="1280 0" dur="8s" repeatCount="indefinite"/></rect>
<rect x="48" y="92" width="379" height="168" rx="12" fill="#0c111b" stroke="#1a2233" stroke-width="1.25"/>
<text x="409" y="122" font-size="12" fill="#33405c" text-anchor="end" letter-spacing="1">01</text>
<text x="70" y="126" font-size="11" letter-spacing="2.5" fill="#8792a8">IN PRODUCTION</text>
<text x="70" y="164" font-size="22" font-weight="700" fill="#eef2fb">Five years, kept boring</text>
<rect x="70" y="176" width="34" height="2.5" fill="#ffb454"/>
<text x="70" y="210" font-size="14.5" font-family="Iowan Old Style, Georgia, 'Times New Roman', serif" font-style="italic" fill="#aeb7c9">The best infrastructure is the</text>
<text x="70" y="233" font-size="14.5" font-family="Iowan Old Style, Georgia, 'Times New Roman', serif" font-style="italic" fill="#aeb7c9">kind nobody has to think about.</text>
<rect x="451" y="92" width="379" height="168" rx="12" fill="#0c111b" stroke="#1a2233" stroke-width="1.25"/>
<text x="811" y="122" font-size="12" fill="#33405c" text-anchor="end" letter-spacing="1">02</text>
<text x="473" y="126" font-size="11" letter-spacing="2.5" fill="#8792a8">WHAT I OWN</text>
<text x="473" y="164" font-size="22" font-weight="700" fill="#eef2fb">The entire cloud estate</text>
<rect x="473" y="176" width="34" height="2.5" fill="#ffb454"/>
<text x="473" y="210" font-size="14.5" font-family="Iowan Old Style, Georgia, 'Times New Roman', serif" font-style="italic" fill="#aeb7c9">Not one team's slice — six live</text>
<text x="473" y="233" font-size="14.5" font-family="Iowan Old Style, Georgia, 'Times New Roman', serif" font-style="italic" fill="#aeb7c9">brands, end to end.</text>
<rect x="853" y="92" width="379" height="168" rx="12" fill="#0c111b" stroke="#1a2233" stroke-width="1.25"/>
<text x="1214" y="122" font-size="12" fill="#33405c" text-anchor="end" letter-spacing="1">03</text>
<text x="875" y="126" font-size="11" letter-spacing="2.5" fill="#8792a8">HOW WORK FINDS ME</text>
<text x="875" y="164" font-size="22" font-weight="700" fill="#eef2fb">No ticket required</text>
<rect x="875" y="176" width="34" height="2.5" fill="#ffb454"/>
<text x="875" y="210" font-size="14.5" font-family="Iowan Old Style, Georgia, 'Times New Roman', serif" font-style="italic" fill="#aeb7c9">If I see it, I build it. I don't</text>
<text x="875" y="233" font-size="14.5" font-family="Iowan Old Style, Georgia, 'Times New Roman', serif" font-style="italic" fill="#aeb7c9">wait to be assigned.</text>
<rect x="48" y="284" width="379" height="168" rx="12" fill="#0c111b" stroke="#1a2233" stroke-width="1.25"/>
<text x="409" y="314" font-size="12" fill="#33405c" text-anchor="end" letter-spacing="1">04</text>
<text x="70" y="318" font-size="11" letter-spacing="2.5" fill="#8792a8">WHAT DONE MEANS</text>
<text x="70" y="356" font-size="22" font-weight="700" fill="#eef2fb">End to end, no ifs</text>
<rect x="70" y="368" width="34" height="2.5" fill="#ffb454"/>
<text x="70" y="402" font-size="14.5" font-family="Iowan Old Style, Georgia, 'Times New Roman', serif" font-style="italic" fill="#aeb7c9">Shipped, observed, and rehearsed</text>
<text x="70" y="425" font-size="14.5" font-family="Iowan Old Style, Georgia, 'Times New Roman', serif" font-style="italic" fill="#aeb7c9">for the day it breaks.</text>
<rect x="451" y="284" width="379" height="168" rx="12" fill="#0c111b" stroke="#1a2233" stroke-width="1.25"/>
<text x="811" y="314" font-size="12" fill="#33405c" text-anchor="end" letter-spacing="1">05</text>
<text x="473" y="318" font-size="11" letter-spacing="2.5" fill="#8792a8">WHEN IT DOESN'T EXIST</text>
<text x="473" y="356" font-size="22" font-weight="700" fill="#eef2fb">I build the tool</text>
<rect x="473" y="368" width="34" height="2.5" fill="#ffb454"/>
<text x="473" y="402" font-size="14.5" font-family="Iowan Old Style, Georgia, 'Times New Roman', serif" font-style="italic" fill="#aeb7c9">Paging, DNS checks, escalation —</text>
<text x="473" y="425" font-size="14.5" font-family="Iowan Old Style, Georgia, 'Times New Roman', serif" font-style="italic" fill="#aeb7c9">self-hosted, not licensed.</text>
<rect x="853" y="284" width="379" height="168" rx="12" fill="#0c111b" stroke="#1a2233" stroke-width="1.25"/>
<text x="1214" y="314" font-size="12" fill="#33405c" text-anchor="end" letter-spacing="1">06</text>
<text x="875" y="318" font-size="11" letter-spacing="2.5" fill="#8792a8">BLAST RADIUS</text>
<text x="875" y="356" font-size="22" font-weight="700" fill="#eef2fb">Plan, then apply</text>
<rect x="875" y="368" width="34" height="2.5" fill="#ffb454"/>
<text x="875" y="402" font-size="14.5" font-family="Iowan Old Style, Georgia, 'Times New Roman', serif" font-style="italic" fill="#aeb7c9">Reversible by default. The 2am</text>
<text x="875" y="425" font-size="14.5" font-family="Iowan Old Style, Georgia, 'Times New Roman', serif" font-style="italic" fill="#aeb7c9">version has to be safe too.</text>
</svg>
